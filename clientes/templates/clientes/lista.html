<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <!-- Si usas Bootstrap, puedes incluirlo aquí -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Listado de Clientes</h1>
    <a href="{% url 'clientes:crear' %}" class="btn btn-primary mb-3">Nuevo Cliente</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for cliente in clientes %}
            <tr>
                <td>{{ cliente.nombre }}</td>
                <td>{{ cliente.correo }}</td>
                <td>{{ cliente.telefono }}</td>
                <td>
                    <a href="{% url 'clientes:editar' cliente.pk %}" class="btn btn-sm btn-warning">Editar</a>
                    <a href="{% url 'clientes:eliminar' cliente.pk %}" class="btn btn-sm btn-danger">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No hay clientes registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
