<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cancelar Reservación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white">
                    <h3 class="card-title mb-0">Cancelar Reservación #{{ reservacion.pk }}</h3>
                </div>
                <div class="card-body">
                    <p class="fs-5">¿Estás seguro de que deseas cancelar la reservación del cliente <strong>{{ reservacion.cliente }}</strong> para la habitación <strong>{{ reservacion.habitacion.numero }}</strong>?</p>
                    <p class="text-muted">Esta acción cambiará el estado de la reservación a cancelada.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'reservaciones:lista' %}" class="btn btn-secondary">Regresar</a>
                            <button type="submit" class="btn btn-danger">Sí, cancelar reservación</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
